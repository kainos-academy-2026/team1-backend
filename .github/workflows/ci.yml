name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Stage 1 - Test and Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm # Cache npm dependencies to speed up builds

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run ci:check 

      - name: Test
        run: npm test

  docker-build:
    name: Stage 2 - Build Container Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag from commit SHA
        id: image_tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "value=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build Docker image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: team1-backend:${{ env.IMAGE_TAG }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify image exists
        run: |
          docker image inspect team1-backend:${IMAGE_TAG}
          docker image ls team1-backend:${IMAGE_TAG}

      - name: Save image as artifact
        run: docker save team1-backend:${IMAGE_TAG} -o team1-backend-${IMAGE_TAG}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: team1-backend-image-${{ steps.image_tag.outputs.value }}
          path: team1-backend-${{ steps.image_tag.outputs.value }}.tar
          retention-days: 3