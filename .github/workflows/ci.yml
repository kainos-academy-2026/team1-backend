name: Team1 Backend CICD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
        
      - name: Say Hello
        run: echo "Sup man" >> $GITHUB_STEP_SUMMARY

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: install dependencies
        run: npm ci

      - name: lint
        run: npm run lint
      
      - name: test
        run: npm run test

    
  docker-image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Docker Image
        uses: docker/setup-buildx-action@v2

      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: |
            team1-backend:latest
            team1-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max