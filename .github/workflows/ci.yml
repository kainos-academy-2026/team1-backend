name: Part B - First Workflow

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  first-workflow:
    name: Checkout and Print Message
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print basic CI message
        run: echo "Hello from GitHub Actions - your first workflow is running."

  build-container:
    name: Part C - Build Docker Image
    runs-on: ubuntu-latest
    needs: first-workflow
    env:
      IMAGE_NAME: team1-backend
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}