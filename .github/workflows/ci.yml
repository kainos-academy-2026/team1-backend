name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Build, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional || npm install --include=optional

      - name: Verify native optional bindings
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Build
        run: npm run build

      - name: Setup Biome CLI
        uses: biomejs/setup-biome@v2
        with:
          version: 2.5.2

      - name: Lint
        run: biome ci .

      - name: Test
        run: npm test

  build-container:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --progress=plain -t team1-backend:${{ github.sha }} -t team1-backend:ci .