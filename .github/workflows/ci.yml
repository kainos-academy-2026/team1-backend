name: CI Pipeline 

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --include=optional

      - name: Ensure Biome and Rolldown Linux binaries are present
        run: npm install --include=optional --no-save @biomejs/cli-linux-x64@2.5.2 @rolldown/binding-linux-x64-gnu@1.1.5

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run ci:check

      - name: Test
        run: npm test

      - name: Build app
        run: npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test-and-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan dependencies and OS packages
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          vuln-type: os,library
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan Terraform misconfigurations
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: ./my-infrastructure
          severity: HIGH,CRITICAL
          exit-code: '1'

  build-container:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: security-scan
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      IMAGE_NAME: team1-backend
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Login to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/cli@v2
        with:
          inlineScript: az acr login --name "$ACR_NAME"

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest