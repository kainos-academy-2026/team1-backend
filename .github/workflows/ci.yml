name: Part B - First Workflow

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  first-workflow:
    name: Checkout and Print Message
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print basic CI message
        run: echo "Hello from GitHub Actions - your first workflow is running."

  test-and-quality:
    name: Part D - Test and Quality
    runs-on: ubuntu-latest
    needs: first-workflow
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --include=optional

      - name: Lint
        run: npm run ci:check

      - name: Test
        run: npm test

      - name: Build app
        run: npm run build

  build-container:
    name: Part C - Build Docker Image
    runs-on: ubuntu-latest
    needs: test-and-quality
    env:
      IMAGE_NAME: team1-backend
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}